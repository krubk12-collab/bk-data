name: Refresh supervision

# ดึงข้อมูลนิเทศ (ผลประเมิน + รายชื่อครู) จาก GAS มาเก็บเป็น supervision.json เสิร์ฟผ่าน CDN
# - ทุก 10 นาที + กดรันเองได้ + รับ repository_dispatch (event 'supervision') ให้ฟอร์ม/GAS ยิงให้รันทันที
# - หมายเหตุ: GitHub cron หน่วง/ข้ามรอบได้ จริงราว ~15-60 นาที — อยากทันทีให้ใช้ repository_dispatch

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [supervision]

permissions:
  contents: write

concurrency:
  group: supervision
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch supervision data from GAS
        id: fetch
        run: |
          URL='https://script.google.com/macros/s/AKfycbwMWJrqTBRVngn-7THkrptWjbBC803G4kdGaPpRRL_7DEMObj7v0G4JOCAqekTocnVQCA/exec'
          curl -sL --retry 3 --retry-delay 5 "$URL" -o sv.new.json
          python3 -c "import json,sys; d=json.load(open('sv.new.json',encoding='utf-8')); sys.exit(0 if d.get('status')=='success' else 1)"
          mv sv.new.json supervision.json

      - name: Commit if changed
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- supervision.json; then
            echo "ไม่มีการเปลี่ยนแปลง — ข้าม commit"
          else
            git add supervision.json
            git commit -m "supervision: update $(date -u +%FT%TZ)"
            git push
          fi

      - name: Log to Run Ledger
        if: always()
        run: |
          curl -sL -G "${{ secrets.LEDGER_URL }}" \
            --data-urlencode "action=logRun" \
            --data-urlencode "key=${{ secrets.LEDGER_KEY }}" \
            --data-urlencode "source=github-actions" \
            --data-urlencode "skill=bk-data-supervision" \
            --data-urlencode "stage=3" \
            --data-urlencode "status=${{ job.status }}" \
            --data-urlencode "summary=refresh ข้อมูลนิเทศ (ทุก 10 นาที)" \
            --data-urlencode "link=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
