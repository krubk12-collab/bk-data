name: Refresh snapshot

# ดึง snapshot จาก GAS (ฐานข้อมูล bk2) มาเก็บเป็น data.json แล้วเสิร์ฟผ่าน GitHub Pages (CDN)
# - ทุก 15 นาที (GitHub อาจหน่วงได้บ้าง) + กดรันเองได้จากแท็บ Actions
# - commit เฉพาะตอนข้อมูลเปลี่ยน

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch snapshot from GAS
        id: fetch
        run: |
          GAS='https://script.google.com/macros/s/AKfycbySCzrwWPDG6jL5LNKqV9LT8dvLZlv7JOz80GwksQjHvtJ5SWOvxl1OfymtTpvN750/exec'
          curl -sL --retry 3 --retry-delay 5 "$GAS?action=getSnapshot" -o data.new.json
          # ตรวจว่าได้ JSON ที่ ok:true จริง (กัน GAS error / หน้า login / redirect เพี้ยน)
          python3 -c "import json,sys; d=json.load(open('data.new.json',encoding='utf-8')); sys.exit(0 if d.get('ok') else 1)"
          mv data.new.json data.json

      - name: Commit if changed
        run: |
          git config user.name  "snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "ไม่มีการเปลี่ยนแปลง — ข้าม commit"
          else
            git add data.json
            git commit -m "snapshot: update $(date -u +%FT%TZ)"
            git push
          fi

      - name: Log to Run Ledger
        if: always()
        run: |
          curl -sL -G "${{ secrets.LEDGER_URL }}" \
            --data-urlencode "action=logRun" \
            --data-urlencode "key=${{ secrets.LEDGER_KEY }}" \
            --data-urlencode "source=github-actions" \
            --data-urlencode "skill=bk-data-snapshot" \
            --data-urlencode "stage=3" \
            --data-urlencode "status=${{ job.status }}" \
            --data-urlencode "summary=refresh bk2 snapshot (ทุก 15 นาที)" \
            --data-urlencode "link=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
